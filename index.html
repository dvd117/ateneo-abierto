<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un chatbot te responde. Un agente hace el trabajo contigo. Aprende a delegarle trabajo de oficina a un agente, con herramientas libres, desde Venezuela."
    />
    <meta property="og:site_name" content="Ateneo Abierto" />
    <meta property="og:title" content="Ateneo Abierto — Deja de preguntarle. Empieza a delegarle." />
    <meta
      property="og:description"
      content="Un chatbot te responde. Un agente hace el trabajo contigo. Aprende a delegarle trabajo de oficina a un agente, con herramientas libres, desde Venezuela."
    />
    <meta property="og:image" content="https://ateneo-abierto.org/og.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ateneo-abierto.org/" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ateneo Abierto — Deja de preguntarle. Empieza a delegarle." />
    <meta
      name="twitter:description"
      content="Un chatbot te responde. Un agente hace el trabajo contigo. Aprende a delegarle trabajo de oficina a un agente, con herramientas libres, desde Venezuela."
    />
    <meta name="twitter:image" content="https://ateneo-abierto.org/og.png" />
    <link rel="canonical" href="https://ateneo-abierto.org/" />
    <link rel="alternate" hreflang="es" href="https://ateneo-abierto.org/?lang=es" />
    <link rel="alternate" hreflang="en" href="https://ateneo-abierto.org/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://ateneo-abierto.org/" />
    <meta name="theme-color" content="#16150f" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/figtree-latin.woff2"
      crossorigin
    />
    <!-- The headline is the largest paint on the page; preload its face with it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fraunces-latin.woff2"
      crossorigin
    />
    <title>Ateneo Abierto</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google reads the SERP site name from WebSite.name here first, ahead of
         og:site_name and <title>. Without it, it falls back to the bare domain. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://ateneo-abierto.org/#website",
            "url": "https://ateneo-abierto.org/",
            "name": "Ateneo Abierto",
            "alternateName": "Ateneo Abierto — delegar, no preguntar",
            "description": "Un chatbot te responde. Un agente hace el trabajo contigo. Aprende a delegarle trabajo de oficina a un agente, con herramientas libres, desde Venezuela.",
            "inLanguage": ["es", "en"],
            "publisher": { "@id": "https://ateneo-abierto.org/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://ateneo-abierto.org/#organization",
            "name": "Ateneo Abierto",
            "url": "https://ateneo-abierto.org/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://ateneo-abierto.org/avatar-1024.png",
              "width": 1024,
              "height": 1024
            },
            "email": "ateneo@aragort.com"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app" data-locale="es"><!--prerender--></div>
    <noscript>
      <style>
        .agent-thread[data-autoplay] [data-beat] {
          display: revert;
        }

        /* Nothing adds .is-revealed without JavaScript; show the sections. */
        [data-reveal] {
          opacity: 1;
          transform: none;
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
