<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f3eddf"/>
  <rect x="0" y="0" width="8" height="630" fill="#b55234"/>

  <!-- Left column: wordmark + tagline -->
  <text x="72" y="218"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="108" font-weight="700" fill="#171a16"
        letter-spacing="-3">Ateneo</text>
  <text x="72" y="334"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="108" font-weight="700" fill="#171a16"
        letter-spacing="-3">Abierto</text>

  <rect x="72" y="362" width="192" height="4" fill="#b55234"/>

  <text x="72" y="418"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="27" font-weight="600" fill="#235e4f">Skills and tools no government</text>
  <text x="72" y="452"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="27" font-weight="600" fill="#235e4f">can take away.</text>

  <text x="72" y="572"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#b55234"
        letter-spacing="3">ATENEO-ABIERTO.ORG</text>

  <!-- Right column: large staircase mark (scale 5.5 from 80×80 source) -->
  <!-- Original path: M14 68 L14 52 L32 52 L32 36 L50 36 L50 20 L66 20  -->
  <!-- translate(680,80) scale(5.5): bottom=(757,454) top=(1043,190)     -->
  <!-- stroke-width 2.5 × 5.5 = ~14px rendered                          -->
  <g transform="translate(680, 80) scale(5.5)">
    <path d="M14 68 L14 52 L32 52 L32 36 L50 36 L50 20 L66 20"
          stroke="#b55234" stroke-width="2.5" fill="none"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="52" y="12" width="8" height="8" fill="#235e4f"/>
  </g>
</svg>
