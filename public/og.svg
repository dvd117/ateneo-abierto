<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @font-face {
      font-family: "Figtree";
      font-style: normal;
      font-weight: 300 900;
      src: url("fonts/figtree-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 400 700;
      src: url("fonts/fraunces-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Fraunces";
      font-style: italic;
      font-weight: 400;
      src: url("fonts/fraunces-latin-italic.woff2") format("woff2");
    }
    .sans {
      font-family: "Figtree", "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }
    .serif {
      font-family: "Fraunces", "Iowan Old Style", Georgia, serif;
    }
    .mono {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
  </style>

  <rect width="1200" height="630" fill="#16150f"/>

  <!-- wordmark, same lockup as the nav: 22 px mark scaled, sans wordmark in text colour -->
  <g transform="translate(80, 74) scale(0.5)">
    <path d="M14 68 L14 52 L32 52 L32 36 L50 36 L50 20 L66 20"
          stroke="#e2a638" stroke-width="5.5" fill="none"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="52" y="12" width="8" height="8" fill="#f0ece2"/>
  </g>
  <text class="sans" x="128" y="105" font-size="22" font-weight="600" fill="#f0ece2"
        letter-spacing="3.1">ATENEO ABIERTO</text>

  <text class="sans" x="80" y="212" font-size="17" font-weight="600" fill="#e2a638"
        letter-spacing="2.4">MÁS ALLÁ DEL CHATBOT</text>

  <text class="serif" x="80" y="316" font-size="88" fill="#f0ece2" letter-spacing="-1">Deja de preguntarle.</text>
  <text class="serif" x="80" y="412" font-size="88" font-style="italic" fill="#f0ece2" letter-spacing="-1">Empieza a delegarle.</text>

  <text class="serif" x="80" y="486" font-size="27" fill="#cfc9bb">Aprende a delegarle trabajo de oficina a un agente,</text>
  <text class="serif" x="80" y="524" font-size="27" fill="#cfc9bb">con herramientas libres, desde Venezuela.</text>

  <line x1="80" y1="562" x2="1120" y2="562" stroke="#34312a" stroke-width="1"/>
  <text class="mono" x="80" y="592" font-size="16" fill="#a8a293">ateneo-abierto.org</text>
</svg>
