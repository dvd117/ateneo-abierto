version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for the dev toolchain rather than five. Vite, vitest and their
    # shared transitive deps move together; splitting them makes every bump a
    # separate red build.
    groups:
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5

    # @types/node tracks the runtime, not npm's latest. CI and the Dockerfile
    # both run Node 22; types from a newer line describe APIs that are not
    # there at runtime, and tsc still goes green. Raise this pin in the same
    # commit that raises the runtime, never before it.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The base image is the one dependency nothing was watching: npm covers the
  # packages, github-actions covers CI, and node:22-alpine was renewed by
  # nobody. Alpine patch releases carry the CVE fixes.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

    # Majors here are the runtime, and dependabot offers "latest", not
    # "supported". On 2026-09-20 it proposed node:22 -> node:25, CI went green,
    # and node 25 had been EOL since 2026-06-01 — an unpatched runtime with no
    # signal anywhere. Patch and minor bumps still flow; the major is a
    # deliberate decision made against the Node release schedule.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

