version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for the dev toolchain rather than five. Vite, vitest and their
    # shared transitive deps move together; splitting them makes every bump a
    # separate red build.
    groups:
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
