name: CodeQL

# Free for public repositories, and the server handles untrusted input:
# an email body, a forwarded address, a subscribe payload. Worth the minutes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
