services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - MAILERLITE_API_KEY=${MAILERLITE_API_KEY}
      - MAILERLITE_GROUP_ES_ID=${MAILERLITE_GROUP_ES_ID}
      - MAILERLITE_GROUP_EN_ID=${MAILERLITE_GROUP_EN_ID}
      - MAILERLITE_PARTICIPATE_ES_ID=${MAILERLITE_PARTICIPATE_ES_ID}
      - MAILERLITE_PARTICIPATE_EN_ID=${MAILERLITE_PARTICIPATE_EN_ID}
      - SITE_ORIGIN=${SITE_ORIGIN}
      - PORT=3000
      # Preview switches (dev.aragort.com): unset in production.
      - NOINDEX=${NOINDEX:-}
      - MAILERLITE_DRY_RUN=${MAILERLITE_DRY_RUN:-}
    networks:
      - dokploy-network
    # Without this, one leak here takes down every other site on the VPS. The
    # app is a Hono process serving prerendered files; 512M is far more than it
    # uses and still small enough to contain a runaway.
    deploy:
      resources:
        limits:
          memory: 512M
    # ROUTER_ID and PUBLIC_HOST let a second Dokploy environment run this file.
    # Traefik can merge same-named routers and services across containers, so a
    # preview that kept the defaults would join production's load balancer.
    # Production sets neither and keeps these defaults.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}.rule=Host(`${PUBLIC_HOST:-ateneo-abierto.org}`) || Host(`www.${PUBLIC_HOST:-ateneo-abierto.org}`)"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}.tls=true"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}.service=${ROUTER_ID:-ateneo-abierto}"
      - "traefik.http.services.${ROUTER_ID:-ateneo-abierto}.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
      # Second layer under the app's own limiter (src/rate-limit.ts): this one
      # turns a flood away at the edge, before it reaches a container at all.
      # Same allowance, so neither layer is the surprising one.
      - "traefik.http.middlewares.${ROUTER_ID:-ateneo-abierto}-subscribe-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.${ROUTER_ID:-ateneo-abierto}-subscribe-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.${ROUTER_ID:-ateneo-abierto}-subscribe-ratelimit.ratelimit.burst=2"
      # depth counts from the RIGHT of X-Forwarded-For, so this is the entry
      # the trusted proxy wrote, not one the visitor could have sent ahead of
      # it. Traefik only keeps an incoming XFF when the peer is a Deflect edge
      # (forwardedHeaders.trustedIPs, re-rendered from the live edge list).
      - "traefik.http.middlewares.${ROUTER_ID:-ateneo-abierto}-subscribe-ratelimit.ratelimit.sourceCriterion.ipStrategy.depth=1"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}-subscribe.rule=(Host(`${PUBLIC_HOST:-ateneo-abierto.org}`) || Host(`www.${PUBLIC_HOST:-ateneo-abierto.org}`)) && Path(`/api/subscribe`)"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}-subscribe.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}-subscribe.tls=true"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}-subscribe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}-subscribe.middlewares=${ROUTER_ID:-ateneo-abierto}-subscribe-ratelimit"
      - "traefik.http.routers.${ROUTER_ID:-ateneo-abierto}-subscribe.service=${ROUTER_ID:-ateneo-abierto}"

networks:
  dokploy-network:
    external: true
