services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - MAILERLITE_API_KEY=${MAILERLITE_API_KEY}
      - MAILERLITE_GROUP_ES_ID=${MAILERLITE_GROUP_ES_ID}
      - MAILERLITE_GROUP_EN_ID=${MAILERLITE_GROUP_EN_ID}
      - MAILERLITE_PARTICIPATE_ES_ID=${MAILERLITE_PARTICIPATE_ES_ID}
      - MAILERLITE_PARTICIPATE_EN_ID=${MAILERLITE_PARTICIPATE_EN_ID}
      - SITE_ORIGIN=${SITE_ORIGIN}
      - PORT=3000
    networks:
      - dokploy-network
    # Without this, one leak here takes down every other site on the VPS. The
    # app is a Hono process serving prerendered files; 512M is far more than it
    # uses and still small enough to contain a runaway.
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ateneo-abierto.rule=Host(`ateneo-abierto.org`) || Host(`www.ateneo-abierto.org`)"
      - "traefik.http.routers.ateneo-abierto.entrypoints=websecure"
      - "traefik.http.routers.ateneo-abierto.tls=true"
      - "traefik.http.routers.ateneo-abierto.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ateneo-abierto.service=ateneo-abierto"
      - "traefik.http.services.ateneo-abierto.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
      # Second layer under the app's own limiter (src/rate-limit.ts): this one
      # turns a flood away at the edge, before it reaches a container at all.
      # Same allowance, so neither layer is the surprising one.
      - "traefik.http.middlewares.ateneo-subscribe-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.ateneo-subscribe-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.ateneo-subscribe-ratelimit.ratelimit.burst=2"
      # depth counts from the RIGHT of X-Forwarded-For, so this is the entry
      # the trusted proxy wrote, not one the visitor could have sent ahead of
      # it. Traefik only keeps an incoming XFF when the peer is a Deflect edge
      # (forwardedHeaders.trustedIPs, re-rendered from the live edge list).
      - "traefik.http.middlewares.ateneo-subscribe-ratelimit.ratelimit.sourceCriterion.ipStrategy.depth=1"
      - "traefik.http.routers.ateneo-subscribe.rule=(Host(`ateneo-abierto.org`) || Host(`www.ateneo-abierto.org`)) && Path(`/api/subscribe`)"
      - "traefik.http.routers.ateneo-subscribe.entrypoints=websecure"
      - "traefik.http.routers.ateneo-subscribe.tls=true"
      - "traefik.http.routers.ateneo-subscribe.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ateneo-subscribe.middlewares=ateneo-subscribe-ratelimit"
      - "traefik.http.routers.ateneo-subscribe.service=ateneo-abierto"

networks:
  dokploy-network:
    external: true
