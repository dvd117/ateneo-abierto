services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - MAILERLITE_API_KEY=${MAILERLITE_API_KEY}
      - MAILERLITE_GROUP_ES_ID=${MAILERLITE_GROUP_ES_ID}
      - MAILERLITE_GROUP_EN_ID=${MAILERLITE_GROUP_EN_ID}
      - MAILERLITE_PARTICIPATE_ES_ID=${MAILERLITE_PARTICIPATE_ES_ID}
      - MAILERLITE_PARTICIPATE_EN_ID=${MAILERLITE_PARTICIPATE_EN_ID}
      - SITE_ORIGIN=${SITE_ORIGIN}
      - PORT=3000
      # Preview switches (dev.ateneo-abierto.org): unset in production.
      - NOINDEX=${NOINDEX:-}
      - MAILERLITE_DRY_RUN=${MAILERLITE_DRY_RUN:-}
    networks:
      - dokploy-network
    # Without this, one leak here takes down every other site on the VPS. The
    # app is a Hono process serving prerendered files; 512M is far more than it
    # uses and still small enough to contain a runaway.
    deploy:
      resources:
        limits:
          memory: 512M
    # ROUTER_ID, PUBLIC_HOST and WWW_HOST name this deploy's Traefik routers,
    # service and hosts, so a second Dokploy environment can run this file.
    # They have no defaults on purpose: a missing one fails the deploy (the
    # running container stays) instead of falling back to production's names
    # and hosts, which a preview would then share with production.
    # Production: ateneo-abierto / ateneo-abierto.org / www.ateneo-abierto.org.
    #
    # The www alias is its own router so that each router asks Let's Encrypt
    # for one host. A combined rule asks for one certificate covering both, and
    # the whole request fails when the alias has no DNS. The preview has no
    # alias: it sets WWW_HOST to its own host, a harmless duplicate route.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_ID:?required}.rule=Host(`${PUBLIC_HOST:?required}`)"
      - "traefik.http.routers.${ROUTER_ID:?required}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_ID:?required}.tls=true"
      - "traefik.http.routers.${ROUTER_ID:?required}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_ID:?required}.service=${ROUTER_ID:?required}"
      - "traefik.http.routers.${ROUTER_ID:?required}-www.rule=Host(`${WWW_HOST:?required}`)"
      - "traefik.http.routers.${ROUTER_ID:?required}-www.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_ID:?required}-www.tls=true"
      - "traefik.http.routers.${ROUTER_ID:?required}-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_ID:?required}-www.service=${ROUTER_ID:?required}"
      - "traefik.http.services.${ROUTER_ID:?required}.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
      # Second layer under the app's own limiter (src/rate-limit.ts): this one
      # turns a flood away at the edge, before it reaches a container at all.
      # Same allowance, so neither layer is the surprising one.
      - "traefik.http.middlewares.${ROUTER_ID:?required}-subscribe-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.${ROUTER_ID:?required}-subscribe-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.${ROUTER_ID:?required}-subscribe-ratelimit.ratelimit.burst=2"
      # depth counts from the RIGHT of X-Forwarded-For, so this is the entry
      # the trusted proxy wrote, not one the visitor could have sent ahead of
      # it. Traefik only keeps an incoming XFF when the peer is a Deflect edge
      # (forwardedHeaders.trustedIPs, re-rendered from the live edge list).
      - "traefik.http.middlewares.${ROUTER_ID:?required}-subscribe-ratelimit.ratelimit.sourceCriterion.ipStrategy.depth=1"
      - "traefik.http.routers.${ROUTER_ID:?required}-subscribe.rule=(Host(`${PUBLIC_HOST:?required}`) || Host(`${WWW_HOST:?required}`)) && Path(`/api/subscribe`)"
      - "traefik.http.routers.${ROUTER_ID:?required}-subscribe.entrypoints=websecure"
      # No certresolver: served from the certificates the routers above obtain.
      - "traefik.http.routers.${ROUTER_ID:?required}-subscribe.tls=true"
      - "traefik.http.routers.${ROUTER_ID:?required}-subscribe.middlewares=${ROUTER_ID:?required}-subscribe-ratelimit"
      - "traefik.http.routers.${ROUTER_ID:?required}-subscribe.service=${ROUTER_ID:?required}"

networks:
  dokploy-network:
    external: true
