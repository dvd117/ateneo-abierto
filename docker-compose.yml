services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - MAILERLITE_API_KEY=${MAILERLITE_API_KEY}
      - MAILERLITE_GROUP_ES_ID=${MAILERLITE_GROUP_ES_ID}
      - MAILERLITE_GROUP_EN_ID=${MAILERLITE_GROUP_EN_ID}
      - MAILERLITE_PARTICIPATE_ES_ID=${MAILERLITE_PARTICIPATE_ES_ID}
      - MAILERLITE_PARTICIPATE_EN_ID=${MAILERLITE_PARTICIPATE_EN_ID}
      - SITE_ORIGIN=${SITE_ORIGIN}
      - PORT=3000
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ateneo-abierto.rule=Host(`ateneo-abierto.org`) || Host(`www.ateneo-abierto.org`)"
      - "traefik.http.routers.ateneo-abierto.entrypoints=websecure"
      - "traefik.http.routers.ateneo-abierto.tls=true"
      - "traefik.http.routers.ateneo-abierto.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ateneo-abierto.service=ateneo-abierto"
      - "traefik.http.services.ateneo-abierto.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
